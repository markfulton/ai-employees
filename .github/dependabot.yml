# The installer and every kit script have no npm dependencies, so the npm entry only watches the lockfile.
# The GitHub Actions entry keeps actions/checkout and actions/setup-node current in CI.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Bump"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Bump"
