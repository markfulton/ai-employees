<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
/* The README hero call to action: the hire path. One wide navy card, the promise on the
   left, the club's cream primary button on the right. Rendered at two times scale from
   --window-size=900,168 and shown at width="900" so it stays crisp on a retina screen.
   Navy on both GitHub themes, a cream rim so it never melts into the dark theme. */
html,body{margin:0;padding:0;background:transparent}
.c{position:relative;box-sizing:border-box;width:900px;height:168px;border-radius:20px;overflow:hidden;background:#0D161B;border:1.5px solid rgba(241,232,203,.26);
 display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-family:Inter,system-ui,sans-serif;color:#f1e8cb}
.glow{position:absolute;inset:0;background:
 radial-gradient(420px 220px at 100% 0%,rgba(11,127,199,.34),transparent 70%),
 radial-gradient(320px 180px at 0% 100%,rgba(241,232,203,.08),transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(241,232,203,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(241,232,203,.045) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(90deg,rgba(0,0,0,.9),transparent 60%)}
.l{position:relative;max-width:540px}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.22em;color:#8fd0f4;font-weight:500;margin-bottom:10px}
h1{font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:30px;line-height:1.08;letter-spacing:-.02em;margin:0 0 10px;color:#f1e8cb}
p{margin:0;font-size:14.5px;line-height:1.45;color:#b9c3c9}
p b{color:#f1e8cb;font-weight:600}
.btn{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.b{box-sizing:border-box;height:58px;padding:0 24px;border-radius:14px;background:#f1e8cb;color:#080f14;display:flex;align-items:center;gap:12px;
 font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;font-size:18px;letter-spacing:-.01em;box-shadow:0 12px 34px rgba(0,0,0,.45)}
.b .a{width:28px;height:28px;border-radius:50%;background:#0d161b;color:#f1e8cb;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:17px}
.b .a span{transform:translateY(-1px)}
.s{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.14em;color:#8fa6b3;font-weight:500}
</style></head><body>
<div class="c"><div class="glow"></div><div class="grid"></div>
<div class="l">
<div class="eyebrow">THE FASTEST WAY TO START</div>
<h1>Hire your first AI Employee in one click</h1>
<p>Pick a role, copy <b>one prompt</b>, and your agent installs it, researches your business and schedules its own routines. Your first brief lands the next morning.</p>
</div>
<div class="btn"><div class="b"><span>Hire my first AI Employee</span><span class="a"><span>&#8594;</span></span></div><div class="s">FREE ACCOUNT · NO CARD · 2 MINUTES</div></div>
</div></body></html>
