<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:transparent}
/* The club's own primary button: cream fill, navy type. The navy rim keeps it
   a button on GitHub's light theme, where cream alone would wash out. Sized to
   sit in a paragraph of README text, not to shout over it. */
.cta{width:330px;height:52px;box-sizing:border-box;border-radius:12px;background:#f1e8cb;border:2px solid #0d161b;
 display:flex;align-items:center;justify-content:center;gap:10px;
 font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:700;font-size:17px;letter-spacing:-.01em;color:#080f14}
.arrow{font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:18px;line-height:1;transform:translateY(-1px)}
</style></head><body>
<div class="cta"><span>Get my install prompt</span><span class="arrow">&#8594;</span></div>
</body></html>
